name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      action:
        type: choice
        required: true
        options:
          - create
          - publish
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Create or publish release
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          case "$ACTION" in
            create) gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "PlasmidLab ${TAG#v}" --notes "" ;;
            publish) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false ;;
            *) echo "Invalid action: $ACTION" >&2; exit 1 ;;
          esac

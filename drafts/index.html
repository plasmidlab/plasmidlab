<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PlasmidLab 시안 비교</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #f4f4f5; color: #18181b; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; } p { margin: 0 0 20px; color: #52525b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card img { display: block; width: 100%; aspect-ratio: 1440/1600; object-fit: cover; object-position: top; background: #e4e4e7; }
  .card div { padding: 12px 14px 14px; }
  .card b { display: block; } .card small { color: #71717a; }
  .card a.btn { display: inline-block; margin: 8px 8px 0 0; font-size: .9rem; color: #2563eb; }
</style>
</head>
<body>
<h1>PlasmidLab 사이트 시안</h1>
<p>카드를 눌러 실제 페이지를 보세요. 각 시안에는 스크롤 영상(preview.mp4)도 있습니다.</p>
<div class="grid" id="g"></div>
<script>
const V = [
  ['a',  'A · Editorial minimal',  'Codex gpt-6.1-sol'],
  ['a2', 'A2 · Editorial minimal', 'Claude Sonnet 5.5'],
  ['b',  'B · Dark lab',           'Claude Opus 5.5'],
  ['c',  'C · Lab notebook',       'Claude Opus 5.5'],
  ['d',  'D · Motion-first',       'Claude Opus 5.5'],
  ['e',  'E · Scientific figure',  'Codex gpt-6.1-sol'],
  ['e2', 'E2 · Scientific figure', 'Claude Sonnet 5.5'],
  ['f',  'F · Swiss poster',       'Codex gpt-6.1-sol'],
  ['g',  'G · App-first tour',     'Codex gpt-6.1-sol'],
  ['h',  'H · Warm & approachable','Codex gpt-6.1-sol'],
];
document.getElementById('g').innerHTML = V.map(([k, t, m]) => `
  <div class="card"><a href="${k}/"><img src="${k}/preview.png" alt="${t}" loading="lazy"></a>
  <div><b>${t}</b><small>${m}</small><br>
  <a class="btn" href="${k}/">페이지 열기</a><a class="btn" href="${k}/preview.mp4">스크롤 영상</a><a class="btn" href="${k}/preview-mobile.png">모바일</a></div></div>`).join('');
</script>
</body>
</html>
